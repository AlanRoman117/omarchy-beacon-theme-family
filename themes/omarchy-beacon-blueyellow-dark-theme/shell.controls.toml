# Section override for the Omarchy shell. The filename selects the
# section, so no [header] is needed. Only this section is replaced;
# the rest of shell.toml is still generated from the default template.

normal-color        = "#D8DFE8"
normal-fill-alpha   = 0.04
normal-border       = "#95A2A9"
normal-border-width = 1
normal-border-alpha = 1.0

hover-cursor-color        = "#FFFFFF"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#FF968F"
hover-cursor-border-width = 2
hover-cursor-border-alpha = 1.0

focus-color        = "#FFFFFF"
focus-fill-alpha   = 0.08
focus-border       = "#FF968F"
focus-border-width = 3
focus-border-alpha = 1.0

selected-color        = "#FFFFFF"
selected-fill-alpha   = 0.18
selected-border       = "#FF968F"
selected-border-width = 2
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35
